services:
  - type: web
    name: skyblock-quant-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SKYBLOCK_QUANT_CORS_ORIGINS
        sync: false
      - key: SKYBLOCK_QUANT_DATABASE_URL
        fromDatabase:
          name: skyblock-quant-db
          property: connectionString

  - type: worker
    name: skyblock-quant-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.collectors.scheduler
    envVars:
      - key: SKYBLOCK_QUANT_DATABASE_URL
        fromDatabase:
          name: skyblock-quant-db
          property: connectionString
      - key: SKYBLOCK_QUANT_RAW_DIR
        value: /var/data/raw
      - key: SKYBLOCK_QUANT_COLLECT_INTERVAL_MINUTES
        value: 5
      - key: SKYBLOCK_QUANT_BACKTEST_HORIZONS
        value: next_snapshot,1h,6h,24h,7d

databases:
  - name: skyblock-quant-db
    databaseName: skyblock_quant
    user: skyblock_quant
