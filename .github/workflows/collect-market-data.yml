name: Collect market data

on:
  workflow_dispatch:
    inputs:
      refresh_metadata:
        description: "Refresh item metadata before collecting Bazaar data"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: collect-market-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: backend
      SKYBLOCK_QUANT_DATABASE_URL: ${{ secrets.SKYBLOCK_QUANT_DATABASE_URL }}
      SKYBLOCK_QUANT_RAW_DIR: /tmp/skyblock-quant-raw
      SKYBLOCK_QUANT_BACKTEST_HORIZONS: next_snapshot,1h,6h,24h,7d

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate database secret
        run: |
          if [ -z "$SKYBLOCK_QUANT_DATABASE_URL" ]; then
            echo "Missing GitHub secret: SKYBLOCK_QUANT_DATABASE_URL" >&2
            exit 1
          fi

      - name: Collect snapshot and run analysis
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.refresh_metadata }}" = "true" ]; then
            EXTRA_ARGS="--refresh-metadata-first"
          fi

          python -m app.collectors.scheduler --max-runs 1 $EXTRA_ARGS
